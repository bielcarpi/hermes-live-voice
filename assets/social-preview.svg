<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Live Voice</title>
  <desc id="desc">Keep talking while Hermes keeps working. Continuous voice, durable tasks, and live progress for Hermes Agent.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45f" />
      <stop offset="0.55" stop-color="#ffd21a" />
      <stop offset="1" stop-color="#d57921" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd21a" stop-opacity="0.25" />
      <stop offset="1" stop-color="#ffd21a" stop-opacity="0" />
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#0b0f14" opacity="0.2" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#080d12" />
  <rect width="1280" height="640" fill="url(#scan)" />
  <circle cx="1040" cy="304" r="300" fill="url(#glow)" />
  <rect x="38" y="38" width="1204" height="564" rx="26" fill="none" stroke="#273441" stroke-width="2" />

  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(82 76)">
      <rect width="72" height="72" rx="17" fill="url(#gold)" />
      <text x="36" y="51" fill="#080d12" font-size="42" font-weight="900" text-anchor="middle">H</text>
      <text x="98" y="28" fill="#ffd21a" font-size="19" font-weight="800" letter-spacing="5">HERMES AGENT</text>
      <text x="98" y="61" fill="#e7edf7" font-size="28" font-weight="750">Hermes Live Voice</text>
    </g>

    <text x="82" y="262" fill="#f4f6f8" font-size="76" font-weight="900" letter-spacing="-2">KEEP TALKING.</text>
    <text x="82" y="350" fill="url(#gold)" font-size="76" font-weight="900" letter-spacing="-2">HERMES KEEPS WORKING.</text>
    <text x="86" y="409" fill="#aebdca" font-size="26">Continuous voice for saved chats, durable tasks, and live progress.</text>

    <g transform="translate(82 482)" font-size="18" font-weight="750" letter-spacing="1">
      <g>
        <rect width="202" height="54" rx="27" fill="#142029" stroke="#4c6575" />
        <circle cx="29" cy="27" r="7" fill="#ffd21a" />
        <text x="49" y="34" fill="#e7edf7">LOCAL VOICE</text>
      </g>
      <g transform="translate(222)">
        <rect width="212" height="54" rx="27" fill="#142029" stroke="#4c6575" />
        <circle cx="29" cy="27" r="7" fill="#ffd21a" />
        <text x="49" y="34" fill="#e7edf7">SAVED CHATS</text>
      </g>
      <g transform="translate(454)">
        <rect width="232" height="54" rx="27" fill="#142029" stroke="#4c6575" />
        <circle cx="29" cy="27" r="7" fill="#ffd21a" />
        <text x="49" y="34" fill="#e7edf7">DURABLE TASKS</text>
      </g>
      <g transform="translate(706)">
        <rect width="222" height="54" rx="27" fill="#142029" stroke="#4c6575" />
        <circle cx="29" cy="27" r="7" fill="#ffd21a" />
        <text x="49" y="34" fill="#e7edf7">LIVE PROGRESS</text>
      </g>
    </g>
  </g>

  <g fill="#ffd21a" opacity="0.95">
    <rect x="1130" y="80" width="34" height="10" />
    <rect x="1176" y="80" width="10" height="34" />
    <rect x="1202" y="80" width="20" height="10" />
  </g>
</svg>
