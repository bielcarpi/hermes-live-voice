name: hermes-live
version: 1.0.1
description: "Continuous realtime voice for Hermes Agent while background work runs and reports back."
author: Biel Carpi and Hermes Live contributors
kind: standalone
provides_tools:
  - hermes_live_status
provides_commands:
  - hermes-live
entrypoint: __init__.py
metadata:
  gateway_default_url: http://127.0.0.1:8788
  websocket_path: /v1/live
  capabilities_path: /v1/capabilities
  ready_path: /ready
  mode: gateway
